name: Check and release
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}
          path: |
            main.js
            manifest.json
            styles.css
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-Windows
      - name: Attach tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          files=(main.js manifest.json)
          if [ -f styles.css ]; then files+=(styles.css); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "$TAG" --notes "See CHANGELOG.md for changes and README.md for installation and limitations."
          fi
